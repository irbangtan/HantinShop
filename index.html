<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Hantin Shop</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Tahoma, Arial, sans-serif;
      background: #fff;
      color: #222;
      text-align: center;
    }

    .container {
      width: 90%;
      max-width: 480px;
      margin: 0 auto;
      padding: 45px 0;
    }

    .logo {
      width: 150px;
      max-width: 60%;
      margin-bottom: 25px;
    }

    h1 {
      font-size: 24px;
      margin: 0 0 8px;
    }

    .subtitle {
      font-size: 14px;
      color: #777;
      margin-bottom: 30px;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .link {
      display: block;
      padding: 15px 20px;
      border: 1px solid #ddd;
      border-radius: 14px;
      color: #222;
      text-decoration: none;
      font-size: 15px;
      background: #fff;
    }

    .link:hover {
      background: #f8f8f8;
    }

    .info {
      margin-top: 35px;
      text-align: right;
      border-top: 1px solid #eee;
      padding-top: 25px;
    }

    .info-item {
      margin-bottom: 20px;
    }

    .info-title {
      font-size: 13px;
      color: #888;
      margin-bottom: 6px;
    }

    .info-text {
      font-size: 14px;
      line-height: 1.8;
    }

    .footer {
      margin-top: 35px;
      font-size: 12px;
      color: #aaa;
    }
  </style>
</head>

<body>

  <div class="container">

    <!-- لوگو -->
    <img src="logo.png" alt="Hantin Shop" class="logo">

    <h1>Hantin Shop</h1>
    <div class="subtitle">منتظر حضورتون هستیم 🤍</div>

    <!-- شبکه‌های اجتماعی و تماس -->
    <div class="links">

      <a class="link" href="#">
        Instagram
      </a>

      <a class="link" href="#">
        Telegram
      </a>

      <a class="link" href="#">
        WhatsApp
      </a>

      <a class="link" href="#">
        Rubika
      </a>

      <a class="link" href="tel:">
        تماس با ما
      </a>

    </div>

    <!-- اطلاعات فروشگاه -->
    <div class="info">

      <div class="info-item">
        <div class="info-title">شماره‌های تماس</div>
        <div class="info-text">
          شماره اول<br>
          شماره دوم
        </div>
      </div>

      <div class="info-item">
        <div class="info-title">آدرس فروشگاه</div>
        <div class="info-text">
          آدرس فروشگاه اینجا قرار می‌گیرد
        </div>
      </div>

      <div class="info-item">
        <div class="info-title">ساعات کاری</div>
        <div class="info-text">
          شنبه تا پنجشنبه<br>
          ساعت کاری اینجا قرار می‌گیرد
        </div>
      </div>

    </div>

    <div class="footer">
      Hantin Shop
    </div>

  </div>

</body>
</html>
